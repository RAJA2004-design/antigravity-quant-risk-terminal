      toOthers: [41.66, 35.00, 24.94, 54.42, 52.99, 49.55, 60.08, 107.20],
      netSpillover: [-22.32, -9.55, -12.51, -2.80, 4.60, -1.27, 6.34, 37.53],
      ssi: 53.23

    function App() {

                  textAlign: "left",
                  color: "#fff"

                <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: "13px" }}>
                  <span>{a.ticker}</span>
                  <span style={{ color: a.change >= 0 ? "#10b981" : "#ef4444", fontSize: "11px" }}>{a.change >= 0 ? `+${a.change}%` : `${a.change}%`}</span>

          {/* NAVIGATION */}

            {["module1", "module2", "module3", "module4", "module5"].map((mod, idx) => {
              const titles = [
                "M1: Risk-Return Profiling",
                "M2: GARCH Volatility Dynamics",
                "M3: Diebold-Yilmaz Spillover (FEVD)",
                "M4: Quantitative Security Scoring (QSS)",
                "M5: Markowitz MVO & Walk-Forward"

                <button
                  key={mod}
                  onClick={() => setActiveTab(mod)}

                    background: activeTab === mod ? "#00f2fe" : "transparent",

                    borderColor: activeTab === mod ? "#00f2fe" : "#1e293b",

                  <div style={{ fontSize: "11px", color: "#00f2fe" }}>SORTINO RATIO</div>
                  <div style={{ fontSize: "24px", fontWeight: 800, color: "#00f2fe" }}>{d.sortino.toFixed(4)}</div>

                      <td style={{ padding: "8px" }}>{(d.aic + 29.6).toFixed(1)}</td>
                      <td style={{ padding: "8px" }}>{(d.bic + 24.3).toFixed(1)}</td>

                      <td style={{ padding: "8px", color: "#00f2fe" }}>{d.aic.toFixed(1)}</td>
                      <td style={{ padding: "8px", color: "#00f2fe" }}>{d.bic.toFixed(1)}</td>
                      <td style={{ padding: "8px", color: "#00f2fe" }}>{d.gamma.toFixed(4)}</td>

                    </tr>
                    <tr>

                      <td style={{ padding: "8px" }}>{(d.bic - 9.1).toFixed(1)}</td>
                      <td style={{ padding: "8px" }}>-0.1056</td>
                      <td style={{ padding: "8px" }}>{d.beta.toFixed(4)}</td>
                      <td style={{ padding: "8px" }}>14.5 Days</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

                <h3 style={{ margin: 0, fontSize: "15px", color: "#f8fafc" }}>Diebold-Yilmaz (2012) Generalized FEVD Matrix (H = 10 Days)</h3>
                <span style={{ background: "rgba(0, 242, 254, 0.15)", border: "1px solid #00f2fe", color: "#00f2fe", padding: "6px 12px", borderRadius: "4px", fontWeight: 800 }}>

                </span>
              </div>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "11px", textAlign: "center" }}>
                  <thead>
                    <tr style={{ borderBottom: "1px solid #334155", color: "#94a3b8" }}>
                      <th style={{ padding: "8px", textAlign: "left" }}>Market</th>
                      {SPILLOVER_MATRIX.assets.map(a => <th key={a} style={{ padding: "8px" }}>{a}</th>)}
                      <th style={{ padding: "8px", color: "#f59e0b" }}>From Others</th>
                      <th style={{ padding: "8px", color: "#00f2fe" }}>Net Spillover</th>
                    </tr>
                  </thead>
                  <tbody>
                    {SPILLOVER_MATRIX.assets.map((rowAsset, i) => (
                      <tr key={rowAsset} style={{ borderBottom: "1px solid #1e293b" }}>
                        <td style={{ padding: "8px", textAlign: "left", fontWeight: 700, color: "#f8fafc" }}>{rowAsset}</td>

                          <td key={j} style={{ padding: "8px", background: i === j ? "#1e293b" : "rgba(0, 242, 254, 0.05)", fontWeight: i === j ? 400 : 700 }}>
                            {val.toFixed(2)}%
                          </td>
                        ))}
                        <td style={{ padding: "8px", color: "#f59e0b", fontWeight: 700 }}>{SPILLOVER_MATRIX.fromOthers[i].toFixed(2)}%</td>
                        <td style={{ padding: "8px", color: SPILLOVER_MATRIX.netSpillover[i] >= 0 ? "#ef4444" : "#10b981", fontWeight: 700 }}>

                    ))}
                    <tr style={{ borderTop: "2px solid #334155", background: "#0b1019", fontWeight: 700 }}>
                      <td style={{ padding: "8px", textAlign: "left", color: "#00f2fe" }}>To Others</td>
                      {SPILLOVER_MATRIX.toOthers.map((val, idx) => (
                        <td key={idx} style={{ padding: "8px", color: "#00f2fe" }}>{val.toFixed(2)}%</td>
                      ))}
                      <td style={{ padding: "8px", color: "#f8fafc" }}>425.8%</td>
                      <td style={{ padding: "8px", color: "#f8fafc" }}>0.0%</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 4: QSS */}
          {activeTab === "module4" && (
            <div style={{ background: "#0d131f", border: "1px solid #1e293b", padding: "20px", borderRadius: "6px" }}>
              <h3 style={{ margin: "0 0 12px 0", fontSize: "15px", color: "#f8fafc" }}>Quantitative Security Scoring (QSS) Multi-Factor Conviction Model</h3>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px", textAlign: "left" }}>
                <thead>
