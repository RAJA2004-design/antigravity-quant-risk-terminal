        if (found) currentStock = found;
      } else if (filteredStocks.length > 0) {
        currentStock = filteredStocks[0];

      // QSS Calculation
      const list = sec.stocks.map(s => ({
        ...s,
        sharpeRatio: (s.annRet - state.rfRate) / (s.annVol || 0.01),
        resilience: 1.0 - s.persistence,
        tailProtection: -s.cvar95,
        momentum: s.mom
      }));

      const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
      const std = arr => Math.sqrt(arr.reduce((a, b) => a + Math.pow(b - mean(arr), 2), 0) / Math.max(1, arr.length - 1)) || 1e-4;

      const mS = mean(list.map(x => x.sharpeRatio)), sS = std(list.map(x => x.sharpeRatio));
      const mR = mean(list.map(x => x.resilience)), sR = std(list.map(x => x.resilience));
      const mT = mean(list.map(x => x.tailProtection)), sT = std(list.map(x => x.tailProtection));
      const mM = mean(list.map(x => x.momentum)), sM = std(list.map(x => x.momentum));

        const zS = (item.sharpeRatio - mS) / sS;
        const zR = (item.resilience - mR) / sR;
        const zT = (item.tailProtection - mT) / sT;
        const zM = (item.momentum - mM) / sM;
        const composite = 0.35 * zS + 0.20 * zR + 0.25 * zT + 0.20 * zM;
        return { ...item, zS, zR, zT, zM, composite };
      });

      qssRankings.sort((a, b) => b.composite - a.composite);

    function renderModule4Tab(sec, currentStock, qssRankings) {

      const cx = 260, cy = 110;

      const pLeft = [cx - norm(activeScored.zM), cy];
      const polyPoints = `${pTop[0]},${pTop[1]} ${pRight[0]},${pRight[1]} ${pBottom[0]},${pBottom[1]} ${pLeft[0]},${pLeft[1]}`;

      return `

    // ==============================================================================
    // EVENT HANDLERS
    // ==============================================================================
    function triggerLiveRefresh() {
      setState({ isLiveActive: false });
      fetch("market_data.json?t=" + Date.now())
        .then(res => res.json())
        .then(payload => {
          if (payload?.quotes) {
            const updated = { ...state.sectorsConfig };
            Object.keys(updated).forEach(secKey => {
              updated[secKey].stocks = updated[secKey].stocks.map(stk => {
                if (payload.quotes[stk.ticker]) {
                  return {
                    ...stk,
                    price: payload.quotes[stk.ticker].price,
                    change: payload.quotes[stk.ticker].change_pct
                  };
                }
                return stk;
              });
            });
            setState({
              sectorsConfig: updated,
              lastUpdated: payload.metadata?.last_updated || state.lastUpdated
            });
          }
        })
        .finally(() => {
          setTimeout(() => setState({ isLiveActive: true }), 600);
        });
    }

    function downloadInstitutionalReport() {
      const headers = [
        "Sector", "Ticker", "Company Name", "Last Price (INR)", "1D Change (%)",
        "Annualized Return (%)", "Annualized Volatility (%)", "Sharpe Ratio", "Sortino Ratio",
        "Parametric VaR 95% (%)", "Conditional VaR 95% (CVaR %)", "GARCH Persistence",
        "Leverage Gamma", "Shock Half-Life (Days)", "QSS Composite Score", "QSS Conviction Tier"
      ];
      const rows = [];
      Object.keys(state.sectorsConfig).forEach(sKey => {
        const sObj = state.sectorsConfig[sKey];
        sObj.stocks.forEach(stk => {
          const sharpe = (stk.annRet - state.rfRate) / (stk.annVol || 0.01);
          const sortino = (stk.annRet - state.rfRate) / ((stk.annVol || 0.01) * 0.72);
          const halfLife = Math.log(0.5) / Math.log(stk.persistence);
          rows.push([
            `"${sKey}"`, `"${stk.ticker}"`, `"${stk.name}"`, stk.price.toFixed(2), stk.change.toFixed(2),
            (stk.annRet * 100).toFixed(2), (stk.annVol * 100).toFixed(2), sharpe.toFixed(4), sortino.toFixed(4),
            (stk.var95 * 100).toFixed(2), (stk.cvar95 * 100).toFixed(2), stk.persistence.toFixed(4),
            stk.gamma.toFixed(4), halfLife.toFixed(1), (stk.annRet * 2 - stk.annVol).toFixed(4), `"Active Constituent"`
          ].join(","));
        });
      });
      const csvData = [headers.join(","), ...rows].join("\n");
      const blob = new Blob([csvData], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const dateStr = new Date().toISOString().split("T")[0];
      link.href = url;
      link.download = `Antigravity_Institutional_Quant_Report_${dateStr}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    // Initial render
    renderApp();
  </script>
